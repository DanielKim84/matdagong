server:
  port: ${SERVER_PORT:5844}

spring:
  application:
    name: matdagong-community-service
  # 커뮤니티 데이터베이스 연결 설정입니다. 스키마와 저장소가 추가되면 이 서비스가 직접 사용합니다.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:54329/matdagong_community}
    username: ${DB_USERNAME:mdg}
    password: ${DB_PASSWORD:mdg_local}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

management:
  endpoints.web.exposure.include: health,info
