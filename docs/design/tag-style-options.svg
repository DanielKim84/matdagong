<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1150" viewBox="0 0 560 1150">
  <rect width="560" height="1150" rx="30" fill="#f8f4ef"/>
  <text x="30" y="50" fill="#3c2c25" font-family="Arial, sans-serif" font-size="25" font-weight="700">태그 스타일 시안 5가지</text>
  <text x="30" y="78" fill="#8e7c70" font-family="Arial, sans-serif" font-size="13">맛다공의 코랄·크림 색감에 맞춘 비교용 시안</text>
  <g font-family="Arial, sans-serif">
    <rect x="20" y="104" width="520" height="190" rx="20" fill="#fffdfa" stroke="#efdfd4"/>
    <text x="42" y="138" fill="#e46b4e" font-size="12" font-weight="700">A · 소프트 라벨</text><text x="42" y="163" fill="#44342c" font-size="17" font-weight="700">음식 종류</text>
    <rect x="42" y="181" width="74" height="36" rx="18" fill="#fff0e7"/><text x="53" y="204" fill="#bd553c" font-size="14" font-weight="700">#한식</text>
    <rect x="124" y="181" width="74" height="36" rx="18" fill="#fff0e7"/><text x="135" y="204" fill="#bd553c" font-size="14" font-weight="700">#일식</text>
    <rect x="206" y="181" width="82" height="36" rx="18" fill="#fff0e7"/><text x="217" y="204" fill="#bd553c" font-size="14" font-weight="700">#중식</text>
    <text x="42" y="258" fill="#8e7c70" font-size="12">옅은 코랄 바탕, 테두리 없이 부드럽게</text>

    <rect x="20" y="310" width="520" height="190" rx="20" fill="#fffdfa" stroke="#efdfd4"/>
