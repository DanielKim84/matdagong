plugins {
    id 'org.springframework.boot' version '4.0.9' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.diffplug.spotless' version '7.0.2' apply false
}

allprojects {
    group = 'kr.matdagong'
    version = '0.1.0-SNAPSHOT'
    repositories { mavenCentral() }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'
    // 실행 jar(bootJar)는 matdagong-api만 만듭니다. common·place·community는 서버가 가져다 쓰는 라이브러리입니다.
    if (name == 'matdagong-api') {
        apply plugin: 'org.springframework.boot'
    } else {
        apply plugin: 'java-library'
    }

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(21) }
    }

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }

    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    // Java 서식 규칙(docs/coding-style.md). 확인: gradlew spotlessCheck, 자동 정리: gradlew spotlessApply
    spotless {
        java {
            target 'src/**/*.java'
            palantirJavaFormat('2.50.0')
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    // 컨트롤러의 @RequestParam·@PathVariable 등은 이름을 따로 적지 않고 매개변수 이름을 그대로 씁니다.
    // Boot 플러그인은 자기 모듈에만 -parameters를 켜므로, 라이브러리 모듈(place·community·common)에도 직접 켭니다.
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-parameters'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
