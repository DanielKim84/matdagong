<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f8" />
    <title>맛다공 인트로 글꼴·헤더 아이콘 시안</title>
    <style>
      :root { color-scheme: light; --coral: #ef365b; --ink: #20252b; --muted: #66717f; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #f5f6f8; color: var(--ink); font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif; }
      main { width: min(1320px, 100%); margin: auto; padding: 40px 24px 64px; }
      header { max-width: 820px; margin: 0 auto 32px; text-align: center; }
      header small { color: var(--coral); font-size: 12px; font-weight: 900; letter-spacing: .12em; }
      h1 { margin: 10px 0; font-size: clamp(28px, 5vw, 42px); letter-spacing: -.05em; }
      header p { color: var(--muted); line-height: 1.7; word-break: keep-all; }
      section { display: grid; gap: 28px; }
      figure { margin: 0; }
      img { display: block; width: 100%; border: 1px solid #e4e5e9; border-radius: 18px; background: white; box-shadow: 0 12px 30px #25304312; }
      figcaption { display: flex; align-items: baseline; gap: 10px; padding: 11px 4px 0; }
      figcaption b { color: var(--coral); font-size: 16px; }
      figcaption span { color: #495361; font-size: 14px; font-weight: 700; }
      .note { margin: 28px auto 0; border-radius: 14px; background: white; padding: 16px 18px; color: #596371; font-size: 13px; line-height: 1.7; }
      @media (max-width: 560px) { main { padding: 26px 12px 42px; } section { gap: 20px; } figcaption { display: block; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <small>MATDAGONG · HEADER ICON OPTIONS</small>
        <h1>상단 아이콘 5가지</h1>
        <p>각 안은 1–5페이지 전체 흐름입니다. 첫 네 페이지는 ‘다음’, 마지막 페이지만 ‘맛다공 시작하기’입니다. 지도에는 실제 앱처럼 맛객 아바타 핀을 사용했습니다. 글꼴은 생성 이미지에서 차이가 충분히 표현되지 않아 <a href="intro-typography-options.html">실제 폰트 비교표</a>를 별도로 만들었습니다.</p>
      </header>
      <section aria-label="상단 아이콘 시안 5개">
        <figure><a href="intro/A-pretendard-fork.png"><img src="intro/A-pretendard-fork.png" alt="A 시안: 포크와 작은 반짝임 아이콘을 적용한 인트로 5페이지 전체" /></a><figcaption><b>A</b><span>포크와 작은 반짝임</span></figcaption></figure>
        <figure><a href="intro/B-suit-plate.png"><img src="intro/B-suit-plate.png" alt="B 시안: 접시와 포크 아이콘을 적용한 인트로 5페이지 전체" /></a><figcaption><b>B</b><span>접시와 포크</span></figcaption></figure>
        <figure><a href="intro/C-noto-heartfork.png"><img src="intro/C-noto-heartfork.png" alt="C 시안: 하트 포크 아이콘을 적용한 인트로 5페이지 전체" /></a><figcaption><b>C</b><span>하트 포크</span></figcaption></figure>
        <figure><a href="intro/D-rounded-gmarket.png"><img src="intro/D-rounded-gmarket.png" alt="D 시안: 굵은 포크와 반짝임 아이콘을 적용한 인트로 5페이지 전체" /></a><figcaption><b>D</b><span>굵은 포크와 반짝임</span></figcaption></figure>
        <figure><a href="intro/E-spoqa-editorial.png"><img src="intro/E-spoqa-editorial.png" alt="E 시안: 포크와 젓가락 아이콘을 적용한 인트로 5페이지 전체" /></a><figcaption><b>E</b><span>포크와 젓가락</span></figcaption></figure>
      </section>
      <p class="note">글꼴 이름은 시각적 방향을 비교하기 위한 참고입니다. 최종 선택 후 실제 앱에 적용할 때는 웹폰트와 라이선스를 확인해야 합니다. 기존 본문 내용과 화면 구성은 유지했습니다.</p>
    </main>
  </body>
</html>
