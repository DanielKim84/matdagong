    <rect x="42" y="387" width="74" height="36" rx="18" fill="#fffdfa" stroke="#e8c8b9"/><text x="53" y="410" fill="#59463b" font-size="14" font-weight="600">#한식</text>
    <rect x="124" y="387" width="74" height="36" rx="18" fill="#fffdfa" stroke="#e8c8b9"/><text x="135" y="410" fill="#59463b" font-size="14" font-weight="600">#일식</text>
    <rect x="206" y="387" width="82" height="36" rx="18" fill="#fffdfa" stroke="#e8c8b9"/><text x="217" y="410" fill="#59463b" font-size="14" font-weight="600">#중식</text>
    <text x="42" y="464" fill="#8e7c70" font-size="12">흰 바탕에 얇은 웜톤 테두리</text>

    <rect x="20" y="516" width="520" height="190" rx="20" fill="#fffdfa" stroke="#efdfd4"/>
