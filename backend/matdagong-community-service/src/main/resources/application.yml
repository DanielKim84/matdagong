server:
  port: ${SERVER_PORT:5844}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 55MB
  config:
    # 루트에서 실행하거나 모듈 폴더에서 실행해도 저장소 루트의 비밀 설정을 읽습니다.
    import:
      - optional:file:./.env[.properties]
      - optional:file:../../.env[.properties]
  application:
    name: matdagong-community-service
  # 사용자 프로필과 커뮤니티 데이터는 공통 인증 DB와 분리해 보관합니다.
  datasource:
    url: ${COMMUNITY_DB_URL:jdbc:postgresql://localhost:54329/matdagong_community}
    username: ${COMMUNITY_DB_USERNAME:mdg}
    password: ${COMMUNITY_DB_PASSWORD:mdg_local}
  flyway:
    enabled: true

dagong:
  auth:
    issuer: ${AUTH_ISSUER:http://localhost:5840}
    client-id: ${AUTH_CLIENT_ID:matdagong-web-dev}
  # 맛집 등록 알림 전에 실제 기록을 확인할 장소 서비스 주소입니다. Gateway를 거치지 않고 직접 호출합니다.
  place-service:
    url: ${PLACE_SERVICE_URL:http://localhost:5845}

management:
  endpoints.web.exposure.include: health,info
