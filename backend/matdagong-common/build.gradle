// 장소·커뮤니티 모듈이 함께 쓰는 계정 ID 꺼내기·오류 문구·외부 호출·이미지 검사·JDBC·글자 도우미·취향 태그 분류와, 두 모듈이
// 서로 묻는 인터페이스(module 패키지: TasterDirectory·PlaceDirectory)입니다(실행 서버 아님). 보안 설정·오류 응답 처리기는
// 실행 서버(matdagong-api)에 있습니다.
apply plugin: 'java-test-fixtures'

dependencies {
    // 실행 서버(Tomcat)와 DB 드라이버는 matdagong-api가 정하고, 여기서는 쓰는 API만 가져옵니다.
    api 'org.springframework:spring-web'
    api 'org.springframework.security:spring-security-oauth2-jose'

    // 장소·커뮤니티 모듈의 DB 테스트가 함께 쓰는 embedded PostgreSQL 지원 클래스입니다.
    testFixturesApi 'io.zonky.test:embedded-postgres:2.1.0'
    testFixturesApi 'org.flywaydb:flyway-database-postgresql'
    testFixturesApi 'org.springframework:spring-jdbc'
    testFixturesApi 'org.junit.jupiter:junit-jupiter-api'
}
