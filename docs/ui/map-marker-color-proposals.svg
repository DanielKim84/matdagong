<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050">
  <defs>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#263346" flood-opacity=".18"/></filter>
    <g id="pin"><path d="M0-29c-15 0-27 12-27 27 0 18 27 45 27 45S27 16 27-2C27-17 15-29 0-29Z" stroke="#fff" stroke-width="3"/></g>
    <g id="person"><circle cx="0" cy="-5" r="8" fill="#fff4e8"/><path d="M-13 13c1-9 6-13 13-13s12 4 13 13Z" fill="#fff4e8"/><path d="M-4-7h1m7 0h1" stroke="#533a35" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="heart"><path d="M0 10S-12 2-12-5a6 6 0 0 1 12-2 6 6 0 0 1 12 2C12 2 0 10 0 10Z" fill="#fff"/></g>
    <g id="store"><path d="M-12-4h24v17h-24z" fill="#fff4e8"/><path d="M-14-4h28l-3-8h-22z" fill="#fff"/><path d="M-10-12v8m7-8v8m7-8v8m7-8v8" stroke="#cf4d43" stroke-width="3"/><path d="M-4 3h8v10h-8z" fill="#cf4d43"/></g>
    <g id="star"><path d="m0-10 3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1Z" fill="#fff"/></g>
    <g id="map-lines" fill="none" stroke="#e4e9eb" stroke-width="10" stroke-linecap="round"><path d="M28 80 310 250M-18 208 260 390M213-12 104 285M465-8 305 300"/></g>
  </defs>
  <rect width="1440" height="1050" fill="#f6f7f8"/>
  <text x="54" y="55" fill="#253245" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="30" font-weight="750">지도 마커 색상 시안</text>
  <text x="54" y="83" fill="#6c7887" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="15">세 안 모두 같은 핀 크기와 투명 배경을 전제로 했어요. 구독 두 종류는 같은 색이고, 안쪽만 캐릭터·프로필 사진으로 구분합니다.</text>
  <g font-family="Segoe UI, Noto Sans KR, sans-serif">
    <g transform="translate(45 112)">
      <rect width="1350" height="286" rx="24" fill="#fff" stroke="#e8ebef"/>
      <text x="28" y="39" fill="#253245" font-size="21" font-weight="700">A · 따뜻한 레드</text><text x="28" y="64" fill="#788493" font-size="13">구독을 선명한 코랄로 강조하고 내 맛집·다른 맛객은 가까운 따뜻한 계열로 묶어요.</text>
      <use href="#map-lines" x="0" y="74"/>
      <g transform="translate(142 166)" filter="url(#shadow)"><use href="#pin" fill="#ed493f"/><use href="#person"/><use href="#star" transform="translate(18 -20) scale(.45)"/></g>
      <g transform="translate(354 166)" filter="url(#shadow)"><use href="#pin" fill="#ed493f"/><circle cy="-5" r="12" fill="#fff"/><circle cy="-5" r="9" fill="#f0c8ad"/><path d="M-9 9c2-7 5-10 9-10s7 3 9 10Z" fill="#855743"/><use href="#star" transform="translate(18 -20) scale(.45)"/></g>
      <g transform="translate(566 166)" filter="url(#shadow)"><use href="#pin" fill="#e59b34"/><use href="#person"/></g>
      <g transform="translate(778 166)" filter="url(#shadow)"><use href="#pin" fill="#7858bd"/><use href="#person"/><use href="#star" transform="translate(18 -20) scale(.45)"/></g>
      <g transform="translate(990 166)" filter="url(#shadow)"><use href="#pin" fill="#f27a62"/><use href="#heart"/></g>
      <g transform="translate(1202 166)" filter="url(#shadow)"><use href="#pin" fill="#63758b"/><use href="#store" transform="scale(.78)"/></g>
      <g fill="#465365" font-size="13" text-anchor="middle"><text x="142" y="247">구독 · 캐릭터</text><text x="354" y="247">구독 · 프로필</text><text x="566" y="247">다른 맛객</text><text x="778" y="247">취향 일치</text><text x="990" y="247">내 맛집</text><text x="1202" y="247">광고</text></g>
    </g>
    <g transform="translate(45 425)">
      <rect width="1350" height="286" rx="24" fill="#fff" stroke="#e8ebef"/>
      <text x="28" y="39" fill="#253245" font-size="21" font-weight="700">B · 산뜻한 청록</text><text x="28" y="64" fill="#788493" font-size="13">구독은 또렷한 청록, 내 맛집은 부드러운 민트, 다른 맛객은 코랄로 구분해요.</text>
      <use href="#map-lines" x="0" y="74"/>
      <g transform="translate(142 166)" filter="url(#shadow)"><use href="#pin" fill="#087f8c"/><use href="#person"/><use href="#star" transform="translate(18 -20) scale(.45)"/></g>
      <g transform="translate(354 166)" filter="url(#shadow)"><use href="#pin" fill="#087f8c"/><circle cy="-5" r="12" fill="#fff"/><circle cy="-5" r="9" fill="#f0c8ad"/><path d="M-9 9c2-7 5-10 9-10s7 3 9 10Z" fill="#855743"/><use href="#star" transform="translate(18 -20) scale(.45)"/></g>
      <g transform="translate(566 166)" filter="url(#shadow)"><use href="#pin" fill="#e66d55"/><use href="#person"/></g>
      <g transform="translate(778 166)" filter="url(#shadow)"><use href="#pin" fill="#765ac4"/><use href="#person"/><use href="#star" transform="translate(18 -20) scale(.45)"/></g>
      <g transform="translate(990 166)" filter="url(#shadow)"><use href="#pin" fill="#62b9a6"/><use href="#heart"/></g>
      <g transform="translate(1202 166)" filter="url(#shadow)"><use href="#pin" fill="#60748c"/><use href="#store" transform="scale(.78)"/></g>
      <g fill="#465365" font-size="13" text-anchor="middle"><text x="142" y="247">구독 · 캐릭터</text><text x="354" y="247">구독 · 프로필</text><text x="566" y="247">다른 맛객</text><text x="778" y="247">취향 일치</text><text x="990" y="247">내 맛집</text><text x="1202" y="247">광고</text></g>
    </g>
    <g transform="translate(45 738)">
      <rect width="1350" height="286" rx="24" fill="#fff" stroke="#e8ebef"/>
      <text x="28" y="39" fill="#253245" font-size="21" font-weight="700">C · 또렷한 퍼플</text><text x="28" y="64" fill="#788493" font-size="13">구독을 퍼플로 강조하고, 내 맛집은 연한 라일락, 다른 맛객은 코랄로 정리해요.</text>
      <use href="#map-lines" x="0" y="74"/>
      <g transform="translate(142 166)" filter="url(#shadow)"><use href="#pin" fill="#6546b8"/><use href="#person"/><use href="#star" transform="translate(18 -20) scale(.45)"/></g>
      <g transform="translate(354 166)" filter="url(#shadow)"><use href="#pin" fill="#6546b8"/><circle cy="-5" r="12" fill="#fff"/><circle cy="-5" r="9" fill="#f0c8ad"/><path d="M-9 9c2-7 5-10 9-10s7 3 9 10Z" fill="#855743"/><use href="#star" transform="translate(18 -20) scale(.45)"/></g>
      <g transform="translate(566 166)" filter="url(#shadow)"><use href="#pin" fill="#e97559"/><use href="#person"/></g>
      <g transform="translate(778 166)" filter="url(#shadow)"><use href="#pin" fill="#e4a631"/><use href="#person"/><use href="#star" transform="translate(18 -20) scale(.45)"/></g>
      <g transform="translate(990 166)" filter="url(#shadow)"><use href="#pin" fill="#9b86dc"/><use href="#heart"/></g>
      <g transform="translate(1202 166)" filter="url(#shadow)"><use href="#pin" fill="#607183"/><use href="#store" transform="scale(.78)"/></g>
      <g fill="#465365" font-size="13" text-anchor="middle"><text x="142" y="247">구독 · 캐릭터</text><text x="354" y="247">구독 · 프로필</text><text x="566" y="247">다른 맛객</text><text x="778" y="247">취향 일치</text><text x="990" y="247">내 맛집</text><text x="1202" y="247">광고</text></g>
    </g>
  </g>
</svg>
