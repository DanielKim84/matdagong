<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc">
  <title id="title">맛다공 홈 브랜드와 하단 메뉴 시안</title>
  <desc id="desc">현재 앱에는 적용하지 않은 홈 상단 브랜드와 하단 내비게이션의 디자인 제안입니다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8ef"/><stop offset="1" stop-color="#fff1e4"/></linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9466"/><stop offset="1" stop-color="#e85c47"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#68452d" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1000" height="920" rx="38" fill="#f4eee7"/>
  <text x="78" y="83" fill="#25383b" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="27" font-weight="750">홈 브랜드 · 하단 메뉴 시안</text>
  <text x="78" y="116" fill="#887d72" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15">맛다공의 따뜻한 식문화와 지도 기능을 한눈에 알아보도록 구성한 제안입니다.</text>
  <rect x="73" y="155" width="854" height="700" rx="35" fill="url(#bg)"/>

  <!-- Home header proposal -->
  <g transform="translate(117 194)">
    <circle cx="28" cy="28" r="27" fill="url(#mark)"/>
    <path d="M14 29c0-8 6-14 14-14s14 6 14 14c0 7-6 13-14 13s-14-6-14-13Z" fill="#fff8ec"/>
    <path d="M20 28c2-4 5-6 8-6 3 0 6 2 8 6M22 33h12" fill="none" stroke="#df7050" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M22 14c0-3 2-5 4-6m5 6c0-3 2-5 4-6" fill="none" stroke="#fff4e7" stroke-width="2.3" stroke-linecap="round"/>
    <text x="68" y="25" fill="#25383b" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="27" font-weight="800" letter-spacing="-1.6">맛다공</text>
    <text x="69" y="45" fill="#9b7660" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="10" font-weight="600" letter-spacing="1.2">취향으로 찾는 한 끼</text>
    <circle cx="690" cy="27" r="21" fill="#fff" stroke="#f0e5da"/>
    <path d="M683 27a8 8 0 1 1 2 5l-5 5m2-9h7" fill="none" stroke="#536264" stroke-width="2" stroke-linecap="round"/>
    <circle cx="744" cy="27" r="21" fill="#fff" stroke="#f0e5da"/>
    <path d="M735 28c0-6 4-10 9-10s9 4 9 10v5l3 4h-24l3-4Zm6 13h6" fill="none" stroke="#536264" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="755" cy="12" r="5" fill="#e75e48" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- Home content hint -->
  <g transform="translate(117 290)">
    <text x="0" y="0" fill="#25383b" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="750">오늘은 어떤 맛을 찾으세요?</text>
    <text x="0" y="27" fill="#887d72" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13">가볍게 둘러보고, 내 취향에 맞는 맛객을 만나보세요.</text>
    <rect x="0" y="55" width="766" height="150" rx="24" fill="#fff" stroke="#f0e4d8"/>
    <circle cx="76" cy="130" r="42" fill="#fff1e3"/>
    <path d="M52 130c5-18 17-27 29-27 14 0 25 11 28 27-6 15-17 23-29 23-11 0-22-8-28-23Z" fill="#f4c86e"/>
    <circle cx="72" cy="124" r="3" fill="#654d3a"/><circle cx="91" cy="124" r="3" fill="#654d3a"/>
    <path d="M73 137c6 6 13 6 19 0" fill="none" stroke="#a55243" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M59 105c-3-6-1-11 3-14m36 14c3-6 1-11-3-14" fill="none" stroke="#df7654" stroke-width="3" stroke-linecap="round"/>
    <text x="143" y="112" fill="#25383b" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700">취향이 닮은 맛객</text>
    <text x="143" y="139" fill="#887d72" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12">좋아하는 메뉴와 방문 스타일로 새로운 맛집을 발견해요.</text>
    <rect x="143" y="158" width="106" height="25" rx="13" fill="#fff1e4"/><text x="158" y="175" fill="#a65a3d" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="10" font-weight="650">#국물요리</text>
    <rect x="258" y="158" width="97" height="25" rx="13" fill="#f1f5e9"/><text x="273" y="175" fill="#66774e" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="10" font-weight="650">#동네맛집</text>
    <circle cx="720" cy="130" r="19" fill="#fff7ef"/><path d="m716 122 8 8-8 8" fill="none" stroke="#aa694e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Proposed bottom navigation -->
  <g filter="url(#shadow)">
    <rect x="105" y="705" width="790" height="104" rx="28" fill="#fff"/>
    <rect x="121" y="720" width="126" height="73" rx="20" fill="#fff1e4"/>
    <g transform="translate(159 731)" fill="none" stroke="#d85f45" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m2 12 13-10 13 10M6 10v17h7v-9h5v9h7V10"/>
    </g>
    <text x="174" y="782" text-anchor="middle" fill="#bb533d" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11" font-weight="700">홈</text>
    <g transform="translate(294 735)" fill="none" stroke="#758082" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 10c0 8-10 17-10 17S3 18 3 10a10 10 0 1 1 20 0Z"/><circle cx="13" cy="10" r="3"/>
    </g>
    <text x="307" y="782" text-anchor="middle" fill="#667173" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11">내 주변</text>
    <circle cx="500" cy="747" r="31" fill="url(#mark)"/>
    <path d="M500 733v28m-14-14h28" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="500" y="792" text-anchor="middle" fill="#667173" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="10">맛집 등록</text>
    <g transform="translate(621 735)" fill="none" stroke="#758082" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12a9 9 0 1 1 3 7l-4 2 1-5"/><path d="M8 12h.01m5 0h.01m5 0h.01"/>
    </g>
    <text x="634" y="782" text-anchor="middle" fill="#667173" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11">소식</text>
    <g transform="translate(762 735)" fill="none" stroke="#758082" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="13" cy="8" r="5"/><path d="M3 27v-3a10 10 0 0 1 20 0v3Z"/>
    </g>
    <text x="775" y="782" text-anchor="middle" fill="#667173" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="11">마이</text>
  </g>
  <text x="500" y="837" text-anchor="middle" fill="#94877b" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12">제안 시안 · 실제 앱 화면에는 아직 반영하지 않았습니다</text>
</svg>
